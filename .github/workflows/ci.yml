name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The visual and host layers of the release gate are not run here, because
# neither can pass on an Ubuntu runner: packages/vscode/test/visual/shot.mjs
# drives Edge from its Windows install paths (`C:/Program Files/.../msedge.exe`),
# and packages/vscode/test/host/run.mjs reads the screen through PowerShell
# CopyFromScreen inside a real VS Code window, which needs a desktop session.
# They stay a Windows step of the release: `npm run test:visual`,
# `npm run test:host`, or the whole gate in one command, `npm run release:gate`
# (pack → verify → vscode tests → visual → host).

jobs:
  test:
    name: Test and package check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync core
        run: npm run sync-core
      - name: Unit tests
        run: npm test
      - name: Global install integration
        run: npm run test:install
      - name: Registry tarball dry run
        run: npm run pack:cli
      - name: GitHub root package dry run
        run: npm pack --dry-run --json

  vscode:
    name: VS Code extension package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VS Code extension dependencies
        run: npm --prefix packages/vscode install
      - name: Typecheck
        run: npm --prefix packages/vscode run typecheck
      - name: Production build
        run: npm --prefix packages/vscode run build
      - name: Unit tests
        run: npm --prefix packages/vscode test
      - name: Package VSIX
        run: npm --prefix packages/vscode run package
